<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#090b10">
    <title>Particle Viz</title>
  </head>
  <body>
    <main id="app">
      <canvas id="canvas" aria-label="Music visualizer"></canvas>
      <header>
        <a class="wordmark" href="/" aria-label="Particle Viz">particle<span>viz</span></a>
        <div class="visualizer glass">
          <label class="sr-only" for="visualizer">Visualizer</label>
          <select id="visualizer"></select>
          <span id="model" class="model"></span>
        </div>
      </header>
      <p id="graphics-status" class="graphics-status glass" role="status" hidden></p>
      <section class="player glass" aria-label="Player controls">
        <div class="track-row">
          <div class="track-info">
            <h1 id="track-name">No track selected</h1>
            <p id="status" class="sr-only" role="status">Choose an audio file.</p>
          </div>
          <label class="upload" title="Open audio">
            <span>Open audio</span>
            <input id="file" type="file" accept="audio/*" aria-label="Open audio">
          </label>
          <label class="color" title="Accent color">
            <span class="sr-only">Accent color</span>
            <input id="accent" type="color" value="#c4f46d">
          </label>
          <button id="play" class="play" disabled aria-label="Play">▶</button>
        </div>
        <div class="transport">
          <span id="elapsed" class="time">0:00</span>
          <input id="seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="Seek track" disabled>
          <span id="duration" class="time">0:00</span>
        </div>
      </section>
    </main>
    <audio id="audio" preload="metadata"></audio>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
